services:
  - type: web
    name: vera-better-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/healthz
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false           # set this manually in Render dashboard
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: TEAM_NAME
        value: Team Vera-Better
      - key: CONTACT_EMAIL
        sync: false